name: Desktop builds and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/test-ci.cjs
      - name: Upload unit test failure log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Sizzla-unit-test-log
          path: '${{ runner.temp }}/sizzla-unit-tests.log'
          if-no-files-found: ignore
          retention-days: 14
      - run: npx playwright install chromium
      - run: npm run test:ui
        env:
          SIZZLA_TEST_DATA: '${{ runner.temp }}/sizzla-ui'
      - run: node tests/desktop-smoke.cjs
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v6
        with:
          name: Sizzla-3000-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/test-ci.cjs
      - name: Upload unit test failure log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Sizzla-unit-test-log-macOS-${{ matrix.arch }}
          path: '${{ runner.temp }}/sizzla-unit-tests.log'
          if-no-files-found: ignore
          retention-days: 14
      - run: npx playwright install chromium
      - run: npm run test:ui
        env:
          SIZZLA_TEST_DATA: '${{ runner.temp }}/sizzla-ui'
      - run: npm run dist:mac -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged macOS application
        shell: bash
        run: |
          APP_PATH=$(find dist -type d -name 'Sizzla 3000.app' -prune -print -quit)
          test -n "$APP_PATH"
          SIZZLA_EXECUTABLE="$PWD/$APP_PATH/Contents/MacOS/Sizzla 3000" node tests/desktop-smoke.cjs
      - uses: actions/upload-artifact@v6
        with:
          name: Sizzla-3000-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: Sizzla-3000-*
          path: release-assets
          merge-multiple: true
      - name: Publish preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.exe release-assets/*.dmg release-assets/*.zip --title "Sizzla 3000 $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --prerelease --verify-tag
