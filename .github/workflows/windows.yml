name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/test-ci.cjs
      - name: Upload unit test failure log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Sizzla-unit-test-log
          path: '${{ runner.temp }}/sizzla-unit-tests.log'
          if-no-files-found: ignore
          retention-days: 14
      - run: npx playwright install chromium
      - run: npm run test:ui
        env:
          SIZZLA_TEST_DATA: '${{ runner.temp }}/sizzla-ui'
      - run: node tests/desktop-smoke.cjs
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v6
        with:
          name: Sizzla-3000-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
      - name: Publish preview release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "Sizzla 3000 $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --prerelease --verify-tag
